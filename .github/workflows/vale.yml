name: Vale prose lint

# Lints docs against the Google developer documentation style guide plus the
# custom TigerData rules. reviewdog reports findings as check annotations on the
# lines you changed (filter_mode: added), and only errors fail the check.
# github-pr-check (vs github-pr-review) posts annotations rather than review
# comments, so re-runs don't accumulate stale comments.

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - ".vale.ini"
      - ".github/styles/**"
      - ".github/workflows/vale.yml"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  vale:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          # Reads .vale.ini, runs `vale sync` to fetch the Google package,
          # then lints. reviewdog filters reporting to added lines.
          reporter: github-pr-check
          filter_mode: added
          fail_on_error: true
          version: 3.14.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}