name: PR Checklist Check

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

jobs:
  check-checklist:
    name: Verify PR Checklist
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check PR template and checkboxes
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            
            // Required checkboxes from the PR template
            const requiredItems = [
              'Is this ready for review',
              'This has deployed to a staging environment correctly',
              'I have reviewed my changes',
              'I have confirmed the content is technically accurate',
              'I have confirmed the content is free of typos or grammar errors',
              'I have reviewed the deployed version of my changes',
              'I have tested any code that is added or updated',
              'I have verified all images and videos are clear',
              'I have verified all images and videos match production',
              'I have tested that the content matches the functionality in production',
              'All checks have passed',
              'This references a feature that is public'
            ];
            
            // Check for required sections
            const hasDescribeSection = prBody.includes('## Describe your changes');
            const hasIssuesSection = prBody.includes('## Related Issues');
            const hasChecklistSection = prBody.includes('## Checklist before requesting a review');
            
            const missingStructure = [];
            if (!hasDescribeSection) missingStructure.push('"## Describe your changes"');
            if (!hasIssuesSection) missingStructure.push('"## Related Issues"');
            if (!hasChecklistSection) missingStructure.push('"## Checklist before requesting a review"');
            
            if (missingStructure.length > 0) {
              core.setFailed(`PR is missing required template sections: ${missingStructure.join(', ')}. Please use the PR template.`);
              return;
            }
            
            // Check that all required checklist items exist and are checked
            const missingItems = [];
            const uncheckedItems = [];
            
            for (const item of requiredItems) {
              // Check if the item exists (either checked or unchecked)
              const uncheckedPattern = new RegExp(`- \\[ \\].*${item.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i');
              const checkedPattern = new RegExp(`- \\[x\\].*${item.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i');
              
              const isUnchecked = uncheckedPattern.test(prBody);
              const isChecked = checkedPattern.test(prBody);
              
              if (!isUnchecked && !isChecked) {
                missingItems.push(item);
              } else if (isUnchecked) {
                uncheckedItems.push(item);
              }
            }
            
            if (missingItems.length > 0) {
              core.setFailed(`PR is missing required items, please do not delete items from the PR template.':\n- ${missingItems.join('\n- ')}`);
              return;
            }
            
            if (uncheckedItems.length > 0) {
              core.setFailed(`Please ensure that you've completed all checklist items before requesting review' Unchecked items:\n- ${uncheckedItems.join('\n- ')}`);
              return;
            }
            
            console.log('Thank you for taking the time to properly review your PR ✨');
