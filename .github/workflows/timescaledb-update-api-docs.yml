name: "TimescaleDB: Update API documentation"

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA, tag, or branch to checkout from timescale/timescaledb'
        required: true
        default: 'main'
        type: string

jobs:
  update-api-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tiger-Data-Docs
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch recent TimescaleDB pull requests
        env:
          GH_TOKEN: ${{ secrets.ORG_AUTOMATION_TOKEN }}
        run: |
          # Calculate timestamp for 24 hours ago
          YESTERDAY=$(date -d '24 hours ago' -u +'%Y-%m-%d')
          echo "Fetching PRs updated since $YESTERDAY"
          gh pr list --repo timescale/timescaledb --search "is:pr is:merged updated:>=$YESTERDAY" --state merged --limit 100 > timescaledb-prs.txt
          cat timescaledb-prs.txt

      - name: Update API references
        env:
          GH_TOKEN: ${{ secrets.ORG_AUTOMATION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install anthropic=="0.*"
          python3 scripts/timescaledb/summarize_daily_changes.py --pr-file timescaledb-prs.txt
