name: Affected pages

on:
  deployment_status:

permissions:
  pull-requests: write
  deployments: read
  contents: read

concurrency:
  group: affected-pages-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  affected-pages:
    if: |
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview') &&
      contains(github.event.deployment_status.target_url, 'vercel.app')
    runs-on: ubuntu-latest
    steps:
      - name: Find PR for this deployment
        id: pr
        uses: actions/github-script@v8
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.DEPLOY_SHA,
            });
            const pr = prs.find((p) => p.state === "open");
            if (!pr) {
              core.info("No open PR for this deployment; skipping.");
              return;
            }
            core.setOutput("number", pr.number);

      - name: Checkout repo at deploy SHA
        if: steps.pr.outputs.number
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Collect changed MDX files
        id: changed
        if: steps.pr.outputs.number
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const pull_number = parseInt(process.env.PR_NUMBER, 10);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            const matching = files
              .filter((f) => f.status !== "removed")
              .map((f) => f.filename)
              .filter(
                (n) =>
                  (n.startsWith("src/content/") || n.startsWith("src/partials/")) &&
                  n.endsWith(".mdx"),
              );
            core.setOutput("any", matching.length > 0 ? "true" : "false");
            core.setOutput("files", matching.join("\n"));

      - name: Compute affected page URLs
        if: steps.changed.outputs.any == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/affected-pages.mjs

      - name: Update PR description
        if: steps.pr.outputs.number
        uses: actions/github-script@v8
        env:
          BODY_PATH: pages-comment.md
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require("fs");
            const start = "<!-- affected-pages:start -->";
            const end   = "<!-- affected-pages:end -->";
            const re = new RegExp(`\\n*${start}[\\s\\S]*?${end}\\n*`);

            const pull_number = parseInt(process.env.PR_NUMBER, 10);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            const original = pr.body || "";
            const hasFile =
              fs.existsSync(process.env.BODY_PATH) &&
              fs.statSync(process.env.BODY_PATH).size > 0;

            let next;
            if (hasFile) {
              const section = fs.readFileSync(process.env.BODY_PATH, "utf8").trim();
              const block = `${start}\n## Affected pages\n${section}\n${end}`;
              if (re.test(original)) {
                next = original.replace(re, `\n\n${block}\n\n`);
              } else {
                const heading = "## Related Issues";
                const idx = original.indexOf(heading);
                if (idx >= 0) {
                  const before = original.slice(0, idx).trimEnd();
                  const after  = original.slice(idx);
                  next = `${before}\n\n${block}\n\n${after}`;
                } else {
                  next = `${original.trim()}\n\n${block}\n`;
                }
              }
            } else if (re.test(original)) {
              // No URLs this run; clean up the previously-injected block.
              next = original.replace(re, "\n\n").replace(/\n{3,}/g, "\n\n");
            } else {
              next = original;
            }

            if (next !== original) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                body: next,
              });
              console.log("PR description updated.");
            } else {
              console.log("No change to PR description.");
            }