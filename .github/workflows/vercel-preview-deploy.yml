name: Deploy Preview

on:
  workflow_run:
    workflows: ["Preview Build"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch != ''
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout main (trusted vercel.json)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: ./build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR number
        id: pr
        run: echo "number=$(cat ./build/metadata/pr-number)" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r ./build/dist/* .vercel/output/static/

          # Convert vercel.json → Build Output API config.json
          node << 'SCRIPT'
          const fs = require("fs");
          const vc = JSON.parse(fs.readFileSync("vercel.json", "utf-8"));
          const routes = [];

          for (const r of vc.redirects || []) {
            const src = "^" + r.source.replace(/\/:(\w+)\*/g, "(?:/(.*))?") + "$";
            routes.push({
              src,
              headers: { Location: r.destination.replace(/:(\w+)\*/g, "$1") },
              status: r.permanent ? 308 : 302,
            });
          }

          for (const h of vc.headers || []) {
            const headers = {};
            for (const { key, value } of h.headers) headers[key] = value;
            routes.push({ src: "^" + h.source + "$", headers, continue: true });
          }

          routes.push({ handle: "filesystem" });

          for (const r of vc.rewrites || []) {
            const src = "^" + r.source.replace(/\/:(\w+)\*/g, "(?:/(.*))?") + "$";
            const dest = r.destination.replace(/:(\w+)\*/g, "$1");
            routes.push({ src, dest, check: true });
          }

          fs.writeFileSync(
            ".vercel/output/config.json",
            JSON.stringify({ version: 3, routes }, null, 2)
          );
          console.log("Generated .vercel/output/config.json");
          console.log(JSON.stringify(routes, null, 2));
          SCRIPT

      - name: Deploy
        id: deploy
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}) && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ -z "$url" ]; then
            echo "::error::Deploy failed after 3 attempts"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const body = `**Vercel Preview Deployment**\n\nPreview: ${process.env.PREVIEW_URL}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Vercel Preview Deployment')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
