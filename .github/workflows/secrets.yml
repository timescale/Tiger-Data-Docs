name: Secrets

# Scans the commits a PR adds for committed credentials, before they reach main and the public
# history. GitHub's own secret scanning runs after a push and blocks only provider-format tokens;
# this check runs gitleaks' full rule set (connection strings, private keys, generic high-entropy
# keys) on `origin/<base>..HEAD` and fails the PR on any hit. The match is redacted in the log.
#
# No licensed Action and no secret: the gitleaks binary is downloaded at a pinned version and its
# SHA-256 is checked against the release checksums before it runs. Rules and allowlist live in
# .gitleaks.toml. Today's tree scanned clean when this was added (2026-11-23); the history holds
# 19 old default-rule hits in files since removed (a pnpm store committed on 2026-02-20, an
# analytics write key in astro.config.ts), out of any PR's range. Same job as doc-tester's.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # origin/<base>..HEAD needs the history

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
        run: |
          set -euo pipefail
          # sha256sum opens the names it reads from the checksum file, so keep the archive's release name.
          ARCHIVE="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION#v}_checksums.txt"
          BIN_DIR="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$BIN_DIR"
          cd "$RUNNER_TEMP"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${CHECKSUMS}" -o "${CHECKSUMS}"
          grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum --check --status
          tar -xzf "${ARCHIVE}" -C "$BIN_DIR" gitleaks
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          "$BIN_DIR/gitleaks" version

      - name: Run gitleaks on the PR's commits
        env:
          BASE_REF: ${{ github.base_ref }} # via env, so the shell never sees interpolated event data
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          gitleaks git --config .gitleaks.toml --redact --exit-code=1 --no-banner \
            --log-opts="origin/$BASE_REF..HEAD"
