# Ensure doc headings use sentence case (first word capitalized; rest lowercase except proper nouns/acronyms).
name: Lint heading case

on:
  pull_request:
    branches: [main, master]
    paths:
      - "src/content/**/*.md"
      - "src/content/**/*.mdx"
  push:
    branches: [main, master]
    paths:
      - "src/content/**/*.md"
      - "src/content/**/*.mdx"

jobs:
  heading-case:
    name: Sentence case headings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint heading case
        run: pnpm run lint:headings
