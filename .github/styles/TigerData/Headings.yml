# Sentence-case headings, replacing Google.Headings (disabled in .vale.ini so
# the two don't both fire).
#
# Why a local copy instead of tuning Google's: the Google style is a managed
# package that `vale sync` re-downloads, so any edit there is overwritten on the
# next sync.
#
# This is an ERROR, so it gates CI on the lines a PR changes. That is only fair
# if the rule doesn't fire on words that are *correctly* capitalized, which is
# what Google's 21-entry exception list was too short to cover. Every proper
# noun, product name, and acronym our headings legitimately contain is listed
# below, so a finding here means a genuine sentence-case mistake.
#
# Product and brand names that live in src/constants.ts are written as {C.X} in
# headings and are stripped before linting by TokenIgnores, so most don't need
# an entry. They are listed anyway for the changelog, which deliberately uses
# literal names (see README-changelog.md).
#
# When you add a product, tool, or integration to the docs, add its capitalized
# words here too, or its first heading will fail CI.
extends: capitalization
message: "'%s' should use sentence-style capitalization."
link: "https://developers.google.com/style/capitalization#capitalization-in-titles-and-headings"
level: error
scope: heading
match: $sentence
indicators:
  - ":"
exceptions:
