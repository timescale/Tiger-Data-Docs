# Spell-out-the-acronym nudge, replacing Google.Acronyms (which is disabled in
# .vale.ini so the two don't both fire).
#
# Why a local copy instead of tuning Google's: the Google style is a managed
# package that `vale sync` re-downloads, so any edit there is overwritten on the
# next sync.
#
# Same mechanism as Google's rule: flag an all-caps token only when the page
# never spells it out as "Full Name (ACRONYM)". The difference is the exception
# list. Google's 54 entries are kept verbatim and extended with the SQL keywords,
# column types, and ordinary English words that our docs write in caps. Those
# are not abbreviations of anything, so "spell out 'TEXT'" is not actionable
# advice. They accounted for well over a third of the findings on the corpus,
# led by TEXT (120), TABLE (37), NULL (35), and INT (26).
#
# A few networking acronyms are excepted alongside them because they are
# universally understood by anyone reading a networking page, and spelling them
# out reads worse than leaving them: API, SSL, DNS.
#
# Genuine domain acronyms (WAL, GUC, IAM, PITR, and so on) are deliberately NOT
# excepted: they should still be spelled out on first use. They are reported
# once per page per acronym rather than on every occurrence, which is applied at
# report time in scripts/lint-prose.mjs and .github/scripts/vale_pr_lint.py.
extends: conditional
message: "Spell out '%s' on first use, if it's unfamiliar to the audience."
link: 'https://developers.google.com/style/abbreviations'
level: suggestion
ignorecase: false
# Ensures that the existence of 'first' implies the existence of 'second'.
first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Z][a-z]+ )+\(([A-Z]{3,5})\)'
exceptions:
  - "ALTER"
  - "AND"
  - "ANY"
  - "API"
  - "ARRAY"
  - "ASC"
  - "ASP"
  - "CHAR"
  - "CHECK"
