extends: substitution
message: "Use '%s' instead of '%s'. The product name is two words."
level: error
ignorecase: false
# Default scope skips code spans/blocks, and .vale.ini's TokenIgnores skip JSX
# tags, so identifiers like TIGERLAKE_NAMESPACE or <MetricsTigerLake /> aren't touched.
swap:
  '\bTiger[Ll]ake\b': Tiger Lake
