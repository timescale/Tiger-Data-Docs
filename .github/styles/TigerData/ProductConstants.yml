# Hand-maintained Vale rule. Nudges literal product and brand names toward the
# {C.X} constant authors should use instead.
#
# Keep this in sync with the product/brand names in src/constants.ts (the
# `// General` and `// Products` sections). Only product/brand names belong
# here — feature, service, project, and pricing common-nouns (hypertable,
# chunk, service, job, and the like) read as ordinary prose and are accepted in
# the vocabulary instead. Never also add a value here to the Vale vocabulary, or
# the nudge is globally suppressed.
#
# Order longest-to-shortest so compound names win over their substrings
# ("Tiger Cloud SQL editor" before "Tiger Cloud" before "Console"). Vale skips
# code spans, fenced blocks, and URLs, so literals in `backticks` and links are
# left alone. Case-sensitive: "Service" and "service" differ.
extends: substitution
message: "Use the constant '%s' instead of the literal '%s' in prose."
link: https://github.com/timescale/Tiger-Data-Docs/blob/main/src/constants.ts
level: suggestion
ignorecase: false
swap:
  'Managed Service for TimescaleDB Console': 'C.MST_CONSOLE_LONG'
  'Managed Service for TimescaleDB': 'C.MST_LONG'
  'Tiger Cloud Iceberg connector': 'C.LAKE_LONG'
