extends: existence
message: "Put UI element names in `code font` (backticks), not **bold**."
link: https://developers.google.com/style/ui-elements
level: warning
# scope: raw so we can see the literal ** markup (Vale strips it in normal scopes).
scope: raw
nonword: true
ignorecase: true
# Heuristic: bold text immediately after a UI-action verb is a UI element name,
# which should be in code font. Plain emphasis (bold not following these verbs)
# is left alone. RE2 has no lookbehind, so the verb is part of the match.
tokens:
  - '\b(?:click|select|choose|press|tap|enable|disable|toggle|clear|check|uncheck|expand|collapse|open)\b(?: (?:on|the|in|your))? \*\*[^*\n]+\*\*'
  - '\b(?:go|navigate) to\b(?: the)? \*\*[^*\n]+\*\*'