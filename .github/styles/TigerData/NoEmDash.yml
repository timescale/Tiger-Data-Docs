extends: existence
message: "Avoid em dashes (—). Rewrite using a comma, colon, parentheses, or two sentences."
level: warning
# nonword: true because the em dash is a non-word character (boundaries would
# stop it from matching). Default scope skips code spans/blocks, so `--flag` and
# fenced code aren't touched; Markdown `---` rules are hyphens, not em dashes.
nonword: true
tokens:
  - '—'