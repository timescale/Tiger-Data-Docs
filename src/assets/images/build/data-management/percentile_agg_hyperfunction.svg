<svg width="745" height="580" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="745" height="580" fill="#fff"/>

  <!-- Raw Data Section -->
  <rect x="50" y="40" width="645" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="372.5" y="62" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    RAW DATA (high volume)
  </text>
  <text x="372.5" y="82" font-family="monospace" font-size="11" text-anchor="middle" fill="#000">
    App Instance 1: [145ms, 230ms, 178ms, 201ms, 192ms, 188ms, ...]
  </text>
  <text x="372.5" y="100" font-family="monospace" font-size="11" text-anchor="middle" fill="#000">
    App Instance 2: [167ms, 189ms, 156ms, 214ms, 199ms, 173ms, ...]
  </text>
  <text x="372.5" y="118" font-family="monospace" font-size="11" text-anchor="middle" fill="#000">
    App Instance N: [198ms, 173ms, 205ms, 188ms, 181ms, 196ms, ...]
  </text>

  <!-- Arrows down with label -->
  <path d="M 222.5 150 L 222.5 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M 372.5 150 L 372.5 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M 522.5 150 L 522.5 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>
  <text x="392.5" y="178" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000">
    percentile_agg
  </text>

  <!-- Compact States Section -->
  <rect x="50" y="210" width="645" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    COMPACT INTERMEDIATE STATES (per minute)
  </text>

  <!-- State boxes -->
  <rect x="100" y="250" width="100" height="60" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Minute 1</text>
  <text x="150" y="290" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">State</text>

  <rect x="230" y="250" width="100" height="60" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="280" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Minute 2</text>
  <text x="280" y="290" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">State</text>

  <rect x="360" y="250" width="100" height="60" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="410" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Minute 3</text>
  <text x="410" y="290" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">State</text>

  <text x="490" y="280" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#666">...</text>

  <rect x="540" y="250" width="100" height="60" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="590" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Minute N</text>
  <text x="590" y="290" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">State</text>

  <!-- Arrows down with label -->
  <path d="M 222.5 340 L 222.5 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M 372.5 340 L 372.5 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M 522.5 340 L 522.5 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>
  <text x="392.5" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000">
    merge states
  </text>
  <text x="392.5" y="375" font-family="Arial, sans-serif" font-size="11" fill="#000">
    (no reprocessing!)
  </text>

  <!-- Rollup Section -->
  <rect x="50" y="400" width="645" height="130" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="372.5" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    ROLLUP AGGREGATIONS
  </text>

  <!-- Rollup boxes -->
  <rect x="177" y="445" width="180" height="60" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="267" y="465" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">Hourly p95</text>
  <text x="267" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">(merge 60 states)</text>

  <rect x="388" y="445" width="180" height="60" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="478" y="465" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">Daily p95</text>
  <text x="478" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">(merge 1440 states)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowgray" markerWidth="6" markerHeight="6" refX="4.5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,4 L5,2 z" fill="#666" />
    </marker>
  </defs>
</svg>