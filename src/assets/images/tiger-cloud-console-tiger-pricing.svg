<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="600" viewBox="0 0 1350 600">
  <!-- Define styles -->
  <defs>
    <style>
      .main-container { fill: white; stroke: black; stroke-width: 3; }
      .main-title { font-family: Arial, sans-serif; font-size: 32px; font-weight: bold; fill: black; }
      .plan-box { fill: white; stroke: black; stroke-width: 2; }
      .plan-title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: black; }
      .section-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: black; }
      .service-box { fill: white; stroke: black; stroke-width: 1.5; }
      .service-box-gray { fill: #e8e8e8; stroke: black; stroke-width: 1.5; }
      .service-label { font-family: Arial, sans-serif; font-size: 12px; fill: black; }
      .capability-text { font-family: Arial, sans-serif; font-size: 10px; fill: black; }
    </style>
  </defs>

  <!-- Main Container -->
  <rect class="main-container" x="20" y="20" width="1320" height="550" rx="10"/>
  <text class="main-title" x="675" y="70" text-anchor="middle">Tiger Cloud Pricing Plans</text>

  <!-- Free Plan -->
  <g id="free-plan">
    <rect class="plan-box" x="50" y="110" width="300" height="415" rx="5"/>
    <text class="plan-title" x="200" y="150" text-anchor="middle">FREE</text>

    <!-- Free Service -->
    <rect class="service-box" x="70" y="180" width="260" height="135" rx="4"/>
    <text class="section-title" x="180" y="205" text-anchor="middle">Free service</text>

    <!-- Small box for Postgres text -->
    <rect class="service-box" x="80" y="235" width="240" height="35" rx="3"/>
    <text class="capability-text" x="200" y="256" text-anchor="middle" font-size="9">Postgres with TimescaleDB and vector extensions</text>

    <line x1="70" y1="285" x2="330" y2="285" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="145" y="302" text-anchor="middle">Shared CPU, 750 MB storage</text>

    <!-- Separator for "Up to 2" section -->
    <line x1="280" y1="180" x2="280" y2="210" stroke="black" stroke-width="1"/>
    <line x1="280" y1="210" x2="330" y2="210" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="305" y="198" text-anchor="middle" font-weight="bold" font-size="9">Up to 2</text>
  </g>

  <!-- Performance Plan -->
  <g id="performance-plan">
    <rect class="plan-box" x="370" y="110" width="300" height="415" rx="5"/>
    <text class="plan-title" x="520" y="150" text-anchor="middle">PERFORMANCE</text>

    <!-- Standard Service -->
    <rect class="service-box-gray" x="390" y="180" width="260" height="165" rx="4"/>
    <text class="section-title" x="520" y="205" text-anchor="middle">Standard service</text>

    <!-- Four small boxes for options -->
    <rect class="service-box" x="405" y="230" width="110" height="30" rx="3"/>
    <text class="capability-text" x="460" y="248" text-anchor="middle">Real-time analytics</text>

    <rect class="service-box" x="525" y="230" width="110" height="30" rx="3"/>
    <text class="capability-text" x="580" y="248" text-anchor="middle">AI-focused</text>

    <rect class="service-box" x="405" y="270" width="110" height="30" rx="3"/>
    <text class="capability-text" x="460" y="288" text-anchor="middle">Hybrid apps</text>

    <rect class="service-box" x="525" y="270" width="110" height="30" rx="3"/>
    <text class="capability-text" x="580" y="288" text-anchor="middle">Vanilla Postgres</text>

    <line x1="390" y1="315" x2="650" y2="315" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="400" y="332" text-anchor="start">Up to 8 CPU/32 GB, 16 TB storage</text>

    <!-- Separator for "Up to 4" section -->
    <line x1="600" y1="180" x2="600" y2="210" stroke="black" stroke-width="1"/>
    <line x1="600" y1="210" x2="650" y2="210" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="625" y="198" text-anchor="middle" font-weight="bold" font-size="9">Up to 4</text>

    <!-- Free Service -->
    <rect class="service-box" x="390" y="370" width="260" height="135" rx="4"/>
    <text class="section-title" x="500" y="395" text-anchor="middle">Free service</text>

    <!-- Small box for Postgres text -->
    <rect class="service-box" x="400" y="425" width="240" height="35" rx="3"/>
    <text class="capability-text" x="520" y="446" text-anchor="middle" font-size="9">Postgres with TimescaleDB and vector extensions</text>

    <line x1="390" y1="475" x2="650" y2="475" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="465" y="492" text-anchor="middle">Shared CPU, 750 MB storage</text>

    <!-- Separator for "Up to 2" section for free service -->
    <line x1="600" y1="370" x2="600" y2="400" stroke="black" stroke-width="1"/>
    <line x1="600" y1="400" x2="650" y2="400" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="625" y="388" text-anchor="middle" font-weight="bold" font-size="9">Up to 2</text>
  </g>

  <!-- Scale Plan -->
  <g id="scale-plan">
    <rect class="plan-box" x="690" y="110" width="300" height="415" rx="5"/>
    <text class="plan-title" x="840" y="150" text-anchor="middle">SCALE</text>

    <!-- Standard Service -->
    <rect class="service-box-gray" x="710" y="180" width="260" height="165" rx="4"/>
    <text class="section-title" x="840" y="205" text-anchor="middle">Standard service</text>

    <!-- Four small boxes for options -->
    <rect class="service-box" x="725" y="230" width="110" height="30" rx="3"/>
    <text class="capability-text" x="780" y="248" text-anchor="middle">Real-time analytics</text>

    <rect class="service-box" x="845" y="230" width="110" height="30" rx="3"/>
    <text class="capability-text" x="900" y="248" text-anchor="middle">AI-focused</text>

    <rect class="service-box" x="725" y="270" width="110" height="30" rx="3"/>
    <text class="capability-text" x="780" y="288" text-anchor="middle">Hybrid apps</text>

    <rect class="service-box" x="845" y="270" width="110" height="30" rx="3"/>
    <text class="capability-text" x="900" y="288" text-anchor="middle">Vanilla Postgres</text>

    <line x1="710" y1="315" x2="970" y2="315" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="720" y="332" text-anchor="start">Up to 32 CPU/128 GB, 16 TB storage</text>

    <!-- Separator for "Unlimited" section -->
    <line x1="905" y1="180" x2="905" y2="210" stroke="black" stroke-width="1"/>
    <line x1="905" y1="210" x2="970" y2="210" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="937" y="198" text-anchor="middle" font-weight="bold" font-size="9">Unlimited</text>

    <!-- Free Service -->
    <rect class="service-box" x="710" y="370" width="260" height="135" rx="4"/>
    <text class="section-title" x="820" y="395" text-anchor="middle">Free service</text>

    <!-- Small box for Postgres text -->
    <rect class="service-box" x="720" y="425" width="240" height="35" rx="3"/>
    <text class="capability-text" x="840" y="446" text-anchor="middle" font-size="9">Postgres with TimescaleDB and vector extensions</text>

    <line x1="710" y1="475" x2="970" y2="475" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="785" y="492" text-anchor="middle">Shared CPU, 750 MB storage</text>

    <!-- Separator for "Up to 2" section for free service -->
    <line x1="920" y1="370" x2="920" y2="400" stroke="black" stroke-width="1"/>
    <line x1="920" y1="400" x2="970" y2="400" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="945" y="388" text-anchor="middle" font-weight="bold" font-size="9">Up to 2</text>
  </g>

  <!-- Enterprise Plan -->
  <g id="enterprise-plan">
    <rect class="plan-box" x="1010" y="110" width="300" height="415" rx="5"/>
    <text class="plan-title" x="1160" y="150" text-anchor="middle">ENTERPRISE</text>

    <!-- Standard Service -->
    <rect class="service-box-gray" x="1030" y="180" width="260" height="165" rx="4"/>
    <text class="section-title" x="1160" y="205" text-anchor="middle">Standard service</text>

    <!-- Four small boxes for options -->
    <rect class="service-box" x="1045" y="230" width="110" height="30" rx="3"/>
    <text class="capability-text" x="1100" y="248" text-anchor="middle">Real-time analytics</text>

    <rect class="service-box" x="1165" y="230" width="110" height="30" rx="3"/>
    <text class="capability-text" x="1220" y="248" text-anchor="middle">AI-focused</text>

    <rect class="service-box" x="1045" y="270" width="110" height="30" rx="3"/>
    <text class="capability-text" x="1100" y="288" text-anchor="middle">Hybrid apps</text>

    <rect class="service-box" x="1165" y="270" width="110" height="30" rx="3"/>
    <text class="capability-text" x="1220" y="288" text-anchor="middle">Vanilla Postgres</text>

    <line x1="1030" y1="315" x2="1290" y2="315" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="1040" y="332" text-anchor="start">Up to 64 CPU/256 GB, 64 TB storage</text>

    <!-- Separator for "Unlimited" section -->
    <line x1="1225" y1="180" x2="1225" y2="210" stroke="black" stroke-width="1"/>
    <line x1="1225" y1="210" x2="1290" y2="210" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="1257" y="198" text-anchor="middle" font-weight="bold" font-size="9">Unlimited</text>

    <!-- Free Service -->
    <rect class="service-box" x="1030" y="370" width="260" height="135" rx="4"/>
    <text class="section-title" x="1140" y="395" text-anchor="middle">Free service</text>

    <!-- Small box for Postgres text -->
    <rect class="service-box" x="1040" y="425" width="240" height="35" rx="3"/>
    <text class="capability-text" x="1160" y="446" text-anchor="middle" font-size="9">Postgres with TimescaleDB and vector extensions</text>

    <line x1="1030" y1="475" x2="1290" y2="475" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="1105" y="492" text-anchor="middle">Shared CPU, 750 MB storage</text>

    <!-- Separator for "Up to 2" section for free service -->
    <line x1="1240" y1="370" x2="1240" y2="400" stroke="black" stroke-width="1"/>
    <line x1="1240" y1="400" x2="1290" y2="400" stroke="black" stroke-width="1"/>
    <text class="capability-text" x="1265" y="388" text-anchor="middle" font-weight="bold" font-size="9">Up to 2</text>
  </g>
</svg>