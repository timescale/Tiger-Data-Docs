<svg width="850" height="320" viewBox="0 0 850 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="850" height="320" fill="white"/>
  
  <!-- Tiger Cloud section -->
  <rect x="19" y="50" width="425" height="240" rx="5" fill="none" stroke="gray" stroke-width="1"/>
  <text x="220" y="75" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="black">Tiger Cloud</text>
  
  <!-- Hypertables -->
  <rect x="50" y="100" width="140" height="70" rx="3" fill="none" stroke="gray" stroke-width="1"/>
  <text x="120" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" fill="black">Hypertables</text>
  <text x="120" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="black">Time-series data</text>
  <text x="120" y="155" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="black">Real-time analytics</text>
  
  <!-- Relational Tables -->
  <rect x="50" y="180" width="140" height="70" rx="3" fill="none" stroke="gray" stroke-width="1"/>
  <text x="120" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" fill="black">Relational tables</text>
  <text x="120" y="225" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="black">Structured data</text>
  <text x="120" y="235" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="black">OLTP operations</text>
  
  <!-- Tiger Lake Connector -->
  <rect x="270" y="140" width="140" height="80" rx="3" fill="none" stroke="gray" stroke-width="1"/>
  <text x="340" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Iceberg</text>
  <text x="340" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="black">connector</text>
  <text x="340" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="black">Apache Iceberg</text>
  <text x="340" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="black">integration</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="gray" opacity="0.8"/>
    </marker>
  </defs>
  
  <!-- Arrow from Hypertables with square corners -->
  <line x1="195" y1="135" x2="210" y2="135" stroke="gray" stroke-width="1.5" opacity="0.8"/>
  <line x1="210" y1="135" x2="210" y2="180" stroke="gray" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Arrow from Relational Tables with square corners -->
  <line x1="195" y1="215" x2="210" y2="215" stroke="gray" stroke-width="1.5" opacity="0.8"/>
  <line x1="210" y1="215" x2="210" y2="180" stroke="gray" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Combined arrow from junction point to Tiger Lake connector -->
  <line x1="210" y1="180" x2="250" y2="180" stroke="gray" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.8"/>
  
  <!-- Sync Arrow to AWS -->
  <line x1="415" y1="180" x2="555" y2="180" stroke="gray" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="490" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="gray">Sync</text>
  
  <!-- Amazon S3 Tables section -->
  <rect x="540" y="50" width="280" height="240" rx="5" fill="none" stroke="gray" stroke-width="1"/>
  <text x="680" y="75" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="black">AWS</text>
  
  <!-- S3 Bucket -->
  <rect x="575" y="115" width="210" height="130" rx="3" fill="none" stroke="gray" stroke-width="1"/>
  <text x="680" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="black">AWS S3 Tables</text>
  <text x="680" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="black">Apache Iceberg REST Catalog</text>
  
</svg>