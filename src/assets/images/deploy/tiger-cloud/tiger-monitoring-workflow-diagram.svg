 <svg width="970" height="500" viewBox="0 0 970 500" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="970" height="500" fill="#fff"/>

  <!-- Big container box -->
  <rect x="20" y="20" width="924" height="420" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>

  <!-- Title -->
  <text x="500" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">
    Tiger Cloud monitoring suite
  </text>

  <!-- Row 1: Steps 1-3 -->

  <!-- Step 6: Recommendations -->
  <rect x="50" y="90" width="230" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="165" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">
    Get proactive guidance
  </text>
  <text x="165" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    Review Recommendations
  </text>
  <text x="165" y="163" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    for alerts that may have
  </text>
  <text x="165" y="181" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    already flagged the problem
  </text>

  <!-- Arrow 6 to 1 -->
  <path d="M 290 150 L 355 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>

  <!-- Step 1: Metrics -->
  <rect x="365" y="90" width="230" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="480" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">
    Pinpoint the bottleneck
  </text>
  <text x="480" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    Check Metrics to identify
  </text>
  <text x="480" y="163" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    exactly when CPU, memory,
  </text>
  <text x="480" y="181" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    or storage spiked
  </text>

  <!-- Arrow 1 to 2 -->
  <path d="M 605 150 L 670 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>

  <!-- Step 2: Logs -->
  <rect x="680" y="90" width="230" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="795" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">
    Find the root cause
  </text>
  <text x="795" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    Review Logs for errors
  </text>
  <text x="795" y="163" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    or warnings that occurred
  </text>
  <text x="795" y="181" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    during the incident
  </text>

  <!-- Arrow 2 to 3 (down) -->
  <path d="M 795 220 L 795 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>

  <!-- Row 2: Steps 3-5 -->

  <!-- Step 3: Insights -->
  <rect x="680" y="280" width="230" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="795" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">
    Identify the culprit
  </text>
  <text x="795" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    Examine Insights to see
  </text>
  <text x="795" y="353" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    which queries were running
  </text>
  <text x="795" y="371" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    and how they impacted resources
  </text>

  <!-- Arrow 3 to 4 -->
  <path d="M 670 340 L 605 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>

  <!-- Step 4: Jobs -->
  <rect x="365" y="280" width="230" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="480" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">
    Check background activity
  </text>
  <text x="480" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    Look at Jobs to see if
  </text>
  <text x="480" y="353" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    scheduled tasks triggered
  </text>
  <text x="480" y="371" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    the issue
  </text>

  <!-- Arrow 4 to 5 -->
  <path d="M 355 340 L 290 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>

  <!-- Step 5: Connections -->
  <rect x="50" y="280" width="230" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="165" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">
    Investigate connections
  </text>
  <text x="165" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    Use Connections to see
  </text>
  <text x="165" y="353" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    what clients were connected
  </text>
  <text x="165" y="371" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">
    and what queries they ran
  </text>


  <!-- Arrow markers -->
  <defs>
    <marker id="arrowgray" markerWidth="6" markerHeight="6" refX="4.5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,4 L5,2 z" fill="#666" />
    </marker>
  </defs>
</svg>