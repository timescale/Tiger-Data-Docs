
<svg viewBox="0 0 800 500" width="800px" height="500px" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">
  <defs>
    <style>
      .title-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #000; text-anchor: middle; }
      .subtitle-text { font-family: Arial, sans-serif; font-size: 12px; fill: #666; text-anchor: middle; }
      .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #000; text-anchor: middle; }
      .small-text { font-family: Arial, sans-serif; font-size: 9px; fill: #000; text-anchor: middle; }
      .primary-box { fill: #fff; stroke: #666; stroke-width: 1; }
      .replica-box { fill: #f8f8f8; stroke: #666; stroke-width: 1; }
      .zone-box { fill: none; stroke: #666; stroke-width: 1; }
      .arrow { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .sync-arrow { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .async-arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); stroke-dasharray: 4,2; }
      .wal-flow { stroke: #333; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#666"/>
    </marker>
  </defs>

  <!-- Overall boundary box -->
  <rect x="30" y="10" width="740" height="470" rx="8" class="zone-box"/>

  <!-- Title -->
  <text x="400" y="35" class="title-text">Tiger Cloud</text>

  <!-- AWS Region boundary -->
  <rect x="80" y="60" width="640" height="400" rx="6" class="zone-box"/>
  <text x="120" y="80" class="subtitle-text">AWS region</text>

  <!-- Availability Zone 1 (Primary) -->
  <rect x="280" y="80" width="240" height="150" rx="6" class="zone-box"/>
  <text x="345" y="100" class="subtitle-text" text-anchor="start">Availability zone 1</text>

  <!-- Primary Node -->
  <rect x="340" y="120" width="120" height="80" rx="4" class="primary-box"/>
  <text x="400" y="145" class="label-text">Primary node</text>
  <text x="400" y="165" class="small-text">Read/write</text>
  <text x="400" y="180" class="small-text">WAL generation</text>

  <!-- Availability Zone 2 (Both Replicas) -->
  <rect x="120" y="280" width="560" height="150" rx="6" class="zone-box"/>
  <text x="175" y="300" class="subtitle-text" text-anchor="start">Availability zone 2</text>

  <!-- Sync Replica -->
  <rect x="180" y="320" width="120" height="90" rx="4" class="replica-box"/>
  <text x="240" y="345" class="label-text">Sync replica</text>
  <text x="240" y="365" class="small-text">Standby for failover</text>
  <text x="240" y="380" class="small-text">Zero lag</text>
  <text x="240" y="395" class="small-text">Longer primary ingest time</text>

  <!-- Async Replica -->
  <rect x="500" y="320" width="120" height="90" rx="4" class="replica-box"/>
  <text x="560" y="345" class="label-text">Async replica</text>
  <text x="560" y="365" class="small-text">Standby for failover</text>
  <text x="560" y="380" class="small-text">Small lag</text>
  <text x="560" y="395" class="small-text">Shortest primary ingest time</text>

  <!-- WAL Streaming Arrows -->
  <!-- Main WAL stream from primary -->
  <path d="M 400 210 L 400 250" stroke="#666" stroke-width="1" fill="none"/>

  <!-- Split to sync replica -->
  <path d="M 400 250 L 260 250 L 260 310" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Split to async replica -->
  <path d="M 400 250 L 560 250 L 560 310" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

  <text x="400" y="260" class="small-text">WAL stream</text>

  <!-- Failover hierarchy arrows -->
  <!-- Primary to Sync failover -->
  <path d="M 340 160 L 240 160 L 240 310" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="3,3"/>

  <!-- Sync to Async failover -->
  <path d="M 311 365 L 489 365" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="3,3"/>

  <!-- Failover label box -->
  <rect x="220" y="150" width="50" height="20" rx="3" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="245" y="163" class="small-text" fill="#999">Failover</text>
  <!-- Promotion label box -->
  <rect x="375" y="355" width="50" height="20" rx="3" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="400" y="368" class="small-text" fill="#999">Failover</text>



</svg>