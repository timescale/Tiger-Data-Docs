<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #000000; }
      .box { fill: #ffffff; stroke: #999999; stroke-width: 1; }
      .box-title { font: bold 18px sans-serif; fill: #000000; }
      .bullet { font: 14px sans-serif; fill: #000000; }
    </style>
  </defs>

  <!-- Main outer box -->
  <rect x="50" y="50" width="874" height="570" rx="8" class="box"/>

  <!-- Title -->
  <text x="500" y="90" class="title" text-anchor="middle">Tiger Data security</text>

  <!-- 5 empty boxes inside -->
  <rect x="80" y="150" width="382" height="200" rx="8" class="box"/>
  <text x="260" y="180" class="box-title" text-anchor="middle">Secure development</text>
  <text x="175" y="220" class="bullet">• Static code analysis</text>
  <text x="175" y="250" class="bullet">• Automated dependency scanning</text>
  <text x="175" y="280" class="bullet">• Code security reviews</text>
  <text x="175" y="310" class="bullet">• pgspot</text>

  <rect x="507" y="150" width="383" height="200" rx="8" class="box"/>
  <text x="680" y="180" class="box-title" text-anchor="middle">Secure access</text>
  <text x="620" y="220" class="bullet">• Role-based access to projects</text>
  <text x="620" y="250" class="bullet">• IP allow lists</text>
  <text x="620" y="280" class="bullet">• Audit-logged operator access</text>

  <rect x="80" y="400" width="270" height="180" rx="8" class="box"/>
  <text x="205" y="430" class="box-title" text-anchor="middle">Data encryption</text>
  <text x="140" y="480" class="bullet">• In transit and at rest</text>
  <text x="140" y="510" class="bullet">• Active database and backup</text>

  <rect x="395" y="400" width="180" height="180" rx="8" class="box"/>
  <text x="485" y="430" class="box-title" text-anchor="middle">Compliance</text>
  <text x="440" y="480" class="bullet">• GDPR</text>
  <text x="440" y="510" class="bullet">• SOC 2</text>
  <text x="440" y="540" class="bullet">• HIPAA</text>

  <rect x="620" y="400" width="270" height="180" rx="8" class="box"/>
  <text x="755" y="430" class="box-title" text-anchor="middle">Networking security</text>
  <text x="673" y="480" class="bullet">• TLS-encrypted connections</text>
  <text x="673" y="510" class="bullet">• Private endpoints</text>
</svg>